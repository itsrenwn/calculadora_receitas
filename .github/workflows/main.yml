name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: python -m pip install --upgrade pip
    - name: Run Tests
      run: python -c "import calculadora; print('Testes passaram!')"

  deploy:
    runs-on: ubuntu-latest
    needs: build  
    if: github.event_name == 'push'
    steps:
    - name: Simulating Deployment
      run: |
        echo "Iniciando deploy..."
        echo "Ambiente de produção atualizado!"
  
  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy] 
    if: always()
    steps:
      - name: Enviar Alerta para o Discord
        uses: johnnyhuy/actions-discord-git-webhook@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}