name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: python -m pip install --upgrade pip
    - name: Run Tests
      run: python -c "import calculadora; print('Testes passaram!')"

  deploy:
    runs-on: ubuntu-latest
    needs: build  
    if: github.event_name == 'push'
    steps:
    - name: Simulating Deployment
      run: |
        echo "Iniciando deploy..."
        echo "Ambiente de produção atualizado!"

  testes: # Este nome aparecerá na lista da Pull Request
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: python -m pip install --upgrade pip
    - name: Run Unit Tests
      run: python -m unittest test_calculadora.py
  
  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always() # Isso garante que ela rode mesmo se o build falhar
    steps:
      - name: Enviar Alerta para o Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.build.result }} 
          title: "Status do Pipeline - Calculadora de Receitas"
          description: "O fluxo de CI/CD foi finalizado."
          color: ${{ needs.build.result == 'success' && '0x00ff00' || '0xff0000' }}