name: Python CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Se tivéssemos um requirements.txt, instalaríamos aqui
        
    - name: Test script execution
      run: |
        # Isso testa se o script Python pelo menos roda sem erros de sintaxe
        python -c "import calculadora; print('Código validado!')"